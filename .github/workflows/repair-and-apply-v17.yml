name: Repair and apply EXP BANK v1.7 patch
on:
  push:
    branches: [feature/v1-7-task-period-reminder-delete]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1-7-task-period-reminder-delete
          fetch-depth: 0
      - name: Recover patch and apply exact-context changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,lzma,base64,hashlib
          yml=Path('.github/workflows/patch-v1-7.yml').read_text()
          b=''.join(re.search(r"payload = '''(.*?)'''",yml,re.S).group(1).split())
          repairs=[('+8fFvIJM','+8f8FvIJM'),('ICKW8aEkW1+7h+','ICKW8aEkW1yW+7h+'),('7VSurVJ6','7VS8urVJ6')]
          for old,new in repairs:
            assert b.count(old)==1,(old,b.count(old))
            b=b.replace(old,new)
          assert len(b)==8224,len(b)
          script=lzma.decompress(base64.b64decode(b))
          assert hashlib.sha256(script).hexdigest()=='e0833b0ec5a65dd66585dd337d6f207bfcce2cf9aa893ec3c12b48ecaaff9e9d'
          exec(compile(script,'patch_v1_7.py','exec'))
          PY
      - name: Validate JavaScript and change markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); w=Path('sw.js').read_text()
          must=["const APP_VERSION = 'v1.7.0';",'taskPeriodKey(t, d = new Date(), previous = false)','id="nt-cycle-every"','id="ed-cycle-every"','deleteConfirmOpen','daylineDueRows','ungrouped-divider']
          for marker in must: assert marker in s,marker
          assert "const CACHE = 'exp-bank-v1.7.0';" in w
          assert "localStorage.getItem('exp-bank-v1')" in s
          b=s.index('<script type="text/x-dc"'); b=s.index('>',b)+1;e=s.index('</script>',b)
          Path('/tmp/exp-bank-v17.js').write_text(s[b:e])
          print('FEATURE_MARKERS_OK',len(s))
          PY
          node --check /tmp/exp-bank-v17.js
      - name: Commit only production files
        run: |
          rm .github/workflows/patch-v1-7.yml .github/workflows/inspect-v17-payload.yml .github/workflows/repair-and-apply-v17.yml
          git config user.name "EXP BANK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows
          git commit -m "feat: v1.7 task cadence, reminders and safe deletion"
          git push origin HEAD:feature/v1-7-task-period-reminder-delete