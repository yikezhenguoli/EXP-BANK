name: Build EXP BANK v1.5
on:
  push:
    branches: [feature/v1-5-bingo-life-skin]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/v1_5_patch.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="text/x-dc"[^>]*>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: EXP BANK v1.5 life skin and bingo [built]'
          file_pattern: 'index.html sw.js'
