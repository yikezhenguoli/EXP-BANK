name: Validate EXP BANK v1.1

on:
  push:
    branches:
      - feature/growth-gallery-v1-1
    paths:
      - '.github/workflows/validate-v110.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-gallery-v1-1
      - name: Static validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="text/x-dc"[^>]*>\n(.*?)\n</script>', s, re.S)
          if not m:
            raise SystemExit('DC script block not found')
          Path('/tmp/expbank.js').write_text(m.group(1), encoding='utf-8')
          required = {
            'task priority': 'priorityRank(p)',
            'task note': 'noteText',
            'daily reward': '今日已兑换 · 明日可兑',
            'countdown minute': 'remainDetail',
            'gallery': 'GROWTH ARCHIVE',
            'indexeddb': "indexedDB.open('exp-bank-gallery-v1'",
            'full gallery backup': 'makeFullBackupAsync',
          }
          missing = [k for k,v in required.items() if v not in s]
          if missing:
            raise SystemExit('Missing feature markers: ' + ', '.join(missing))
          print('Feature markers OK')
          PY
          node --check /tmp/expbank.js
          rm -f .github/workflows/validate-v110.yml
          git config user.name "EXP BANK Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/validate-v110.yml
          git commit -m "chore: validate v1.1 branch"
          git push origin feature/growth-gallery-v1-1
