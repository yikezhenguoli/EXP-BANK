name: Harden EXP BANK v1.1 Gallery
on:
  push:
    branches: [feature/growth-gallery-v1-1]
    paths: ['.github/workflows/apply-v110-gallery-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-gallery-v1-1
      - name: Apply and validate
        run: |
          python3 tools/patch_v110_gallery_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['imageSaved = false','backupFullCode, ...data','GROWTH ARCHIVE']:
              if x not in s: raise SystemExit('missing '+x)
          m=re.search(r'<script type="text/x-dc"[^>]*>\n(.*?)\n</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/expbank.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/expbank.js
          rm -f tools/patch_v110_gallery_fix.py .github/workflows/apply-v110-gallery-fix.yml
          git config user.name "EXP BANK Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tools/patch_v110_gallery_fix.py .github/workflows/apply-v110-gallery-fix.yml
          git commit -m "fix: harden gallery image state and short backups"
          git push origin feature/growth-gallery-v1-1
