name: Patch EXP BANK v1.6.3 Xiaomi file picker compatibility

"on":
  push:
    branches:
      - feature/v1-6-3-xiaomi-file-picker

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1-6-3-xiaomi-file-picker
          fetch-depth: 0
      - name: Apply and validate compatibility patch
        run: python3 .github/patch-v1-6-3.py
      - name: Commit clean feature
        shell: bash
        run: |
          rm -f .github/patch-v1-6-3.py
          rm -f .github/workflows/patch-v1-6-3-xiaomi-file-picker.yml
          git config user.name "EXP BANK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden file picker compatibility on Xiaomi browser"
          git push origin HEAD:feature/v1-6-3-xiaomi-file-picker
