              assert marker in s, marker
          assert "const CACHE = 'exp-bank-v1.7.0';" in w
          assert "localStorage.getItem('exp-bank-v1')" in s
          begin = s.index('<script type="text/x-dc"')
          begin = s.index('>', begin) + 1
          end = s.index('</script>', begin)
          Path('/tmp/exp-bank-v17-logic.js').write_text(s[begin:end])
          print('STATIC_CHECKS_OK', len(s))
          PY
          node --check /tmp/exp-bank-v17-logic.js
