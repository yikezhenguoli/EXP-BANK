name: Apply milestone refinement

on:
  push:
    paths:
      - '.github/workflows/patch-milestone-refinement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_milestone_refinement.py
      - name: Commit result
        run: |
          rm -f .github/patch_milestone_refinement.py
          rm -f .github/workflows/patch-milestone-refinement.yml
          git config user.name "EXP BANK Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine milestone priority and mobile cards"
          git push origin HEAD:main
