name: EXP BANK v1.3 patch

on:
  push:
    branches:
      - feature/v1-3-ops-focus
    paths:
      - .github/workflows/patch-v1-3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1-3-ops-focus
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python .github/patch_v13_ops_focus.py

      - name: Validate generated app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="text/x-dc" data-dc-script'
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit('data-dc script not found')
          start = html.find('>', pos) + 1
          end = html.find('</script>', start)
          Path('/tmp/exp-bank-app.js').write_text(html[start:end], encoding='utf-8')
          required = [
              'v1.3.0', 'id="nc-hour"', 'id="ed-hour"', 'galleryEditOpen',
              'stashWithdraw', 'startReorderOpex', 'startReorderStash', 'pomoRewardExp'
          ]
          for token in required:
              if token not in html:
                  raise SystemExit('missing token: ' + token)
          for old in ['id="nc-time"', 'id="ed-time"']:
              if old in html:
                  raise SystemExit('old ambiguous time input still present: ' + old)
          print('Feature markers OK')
          PY
          node --check /tmp/exp-bank-app.js
          grep -q "exp-bank-v1.3.0" sw.js

      - name: Commit feature changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'feat: refine countdown archive finance and focus controls'
          git push origin HEAD:feature/v1-3-ops-focus
