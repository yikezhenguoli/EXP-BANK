name: EXP BANK v1.7 recurrence safeguard
on:
  push:
    branches:
      - feature/v1-7-recurrence-reminder-safety
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1-7-recurrence-reminder-safety
          fetch-depth: 0
      - name: Apply guarded recurrence fix
        run: |
          python3 .github/refine_v17.py
          node --check /tmp/exp-v17-logic.js
      - name: Validate period compatibility
        run: |
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const ctx = {DCLogic:class{},Date,Math,console,setTimeout:()=>{},clearTimeout:()=>{}};
          vm.runInNewContext(fs.readFileSync('/tmp/exp-v17-logic.js','utf8')+'\n;globalThis.Test=Component;',ctx);
          const app = Object.create(ctx.Test.prototype);
          app.todayKey = () => '2026-09-21';
          const t = {cycle:'daily',interval:2,anchorDate:'2026-09-21'};
          assert.equal(app.periodKey(t,new Date('2026-09-21T12:00:00')),app.periodKey(t,new Date('2026-09-22T12:00:00')));
          assert.notEqual(app.periodKey(t,new Date('2026-09-22T12:00:00')),app.periodKey(t,new Date('2026-09-23T12:00:00')));
          assert.equal(app.periodKey({cycle:'daily',interval:1},new Date('2026-09-21T12:00:00')),app.keyFor('daily',new Date('2026-09-21T12:00:00')));
          console.log('PASS recurrence period compatibility');
          JS
      - name: Commit production-only patch
        run: |
          rm .github/workflows/refine-v17.yml .github/refine_v17.py
          git config user.name "EXP BANK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/refine-v17.yml .github/refine_v17.py
          git diff --cached --check
          git commit -m "fix: guard edited recurrence from stale active period counts"
          git push origin HEAD:feature/v1-7-recurrence-reminder-safety