name: validate v1.12 simplification

on:
  push:
    branches:
      - feature/v1-12-simplify-maintenance-war

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check progression.js
          node --check task-assistant.js
          node --check life-architecture.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'<script type="text/x-dc"[^>]*>([\s\S]*?)</script>', source)
          assert m, "embedded app script not found"
          Path("/tmp/app.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/app.js
      - name: Run Node smoke suites
        run: |
          node tests/money-state.smoke.mjs
          node tests/assistant.smoke.mjs
          node tests/life.smoke.mjs
          node tests/component.smoke.mjs
          node tests/sw-update.smoke.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke suites
        run: |
          node tests/browser.smoke.mjs
          node tests/assistant-browser.smoke.mjs
          node tests/life-browser.smoke.mjs
      - name: Validate removed UI and CORE-only WAR
        run: |
          ! grep -q "生活维护 · 今日" index.html
          ! grep -q "+ 维护任务" index.html
          ! grep -q "关键 GROWTH · WAR MODE 保留" index.html
          ! grep -q 'id="nt-task-kind"' index.html
          ! grep -q 'id="ed-task-kind"' index.html
          ! grep -q 'id="nt-war-important"' index.html
          ! grep -q 'id="ed-war-important"' index.html
          grep -q "WAR MODE ACTIVE · 仅显示 CORE 最低运行目标" index.html
          grep -q "function inWarMode(task) { return task.lifeType === 'CORE'; }" progression.js
          grep -q "simplify-20261008" sw.js
