name: Apply EXP BANK v1.1 Growth Gallery

on:
  push:
    branches:
      - feature/growth-gallery-v1-1
    paths:
      - '.github/workflows/apply-v110-b.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-gallery-v1-1
      - name: Apply patch B
        run: |
          python3 tools/patch_v110_b.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
            'GROWTH ARCHIVE',
            'reflectionOpen',
            "indexedDB.open('exp-bank-gallery-v1'",
            'makeFullBackupAsync',
            'restoreGalleryImages',
            '保存到集锦',
            'galleryEntries: []',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
            raise SystemExit('Missing checks: ' + repr(missing))
          print('Gallery static checks passed')
          PY
          rm -f tools/patch_v110_b.py .github/workflows/apply-v110-b.yml
          git config user.name "EXP BANK Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tools/patch_v110_b.py .github/workflows/apply-v110-b.yml
          git commit -m "feat: add growth gallery reflections and photo archive"
          git push origin feature/growth-gallery-v1-1
