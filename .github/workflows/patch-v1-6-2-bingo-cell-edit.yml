name: Patch EXP BANK v1.6.2 Bingo cell edit

"on":
  push:
    branches:
      - feature/v1-6-2-bingo-cell-edit

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1-6-2-bingo-cell-edit
          fetch-depth: 0
      - name: Apply and validate Bingo patch
        run: python3 .github/patch-v1-6-2-bingo.py
      - name: Commit clean feature
        shell: bash
        run: |
          rm -f .github/patch-v1-6-2-bingo.py
          rm -f .github/workflows/patch-v1-6-2-bingo-cell-edit.yml
          git config user.name "EXP BANK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Bingo entries removable"
          git push origin HEAD:feature/v1-6-2-bingo-cell-edit
