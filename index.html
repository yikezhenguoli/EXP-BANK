document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

gradient(180deg,{{ cardTop }} 0%,{{ cardBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.24),rgba(255,255,255,0.06) 38%,rgba(255,255,255,0.02) 72%,rgba(255,255,255,0.07)) border-box;border:1.5px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 18px 46px rgba(0,0,0,0.42);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:3px;height:14px;border-radius:2px;background:{{ tierGrad }};\"><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#c8cedb;\">SHOPPING MALL // REDEEM<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n        <sc-for list=\"{{ rewards }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"background:linear-gradient(180deg,{{ rowTop }} 0%,{{ rowBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.2),rgba(255,255,255,0.05) 42%,rgba(255,255,255,0.02)) border-box;border:1px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 12px 28px rgba(0,0,0,0.4);border-radius:12px;overflow:hidden;position:relative;\">\n            <div sc-camel-on-click=\"{{ r.onDel }}\" style=\"cursor:pointer;position:absolute;top:6px;right:8px;z-index:2;color:rgba(230,233,240,0.55);font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,0.8);\" style-hover=\"color:#f87171;\">×<\u002Fdiv>\n            <div style=\"position:relative;height:104px;\">\n              <x-import component-from-global-scope=\"image-slot\" from=\"331844cf-96d7-4cde-83d8-62bed2a90b9d#/image-slot.js\" id=\"{{ r.imgId }}\" shape=\"rect\" radius=\"0\" placeholder=\"{{ r.imgHint }}\" hint-size=\"100%,104px\" style=\"position:absolute;inset:0;\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ r.onEdit }}\" title=\"点击编辑此奖励\" style=\"cursor:pointer;padding:10px 12px;display:flex;flex-direction:column;ga     <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center;\">\n        <input id=\"nr-name\" placeholder=\"新奖励名\" style=\"flex:1;min-width:0;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px 10px;color:#e6e9f0;font-size:13px;font-family:inherit;\">\n        <input id=\"nr-cost\" placeholder=\"价格\" type=\"number\" style=\"width:64px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n        <div sc-camel-on-click=\"{{ addReward }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:{{ accent }};border:1px solid #2a2f3a;border-radius:8px;padding:7px 12px;\" style-hover=\"border-color:#4ade80;\">+ 添加<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MILESTONES -->\n    <div style=\"background:linear-gradient(180deg,{{ cardTop }} 0%,{{ cardBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.24),rgba(255,255,255,0.06) 38%,rgba(255,255,255,0.02) 72%,rgba(255,255,255,0.07)) border-box;border:1.5px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 18px 46px rgba(0,0,0,0.42);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:3px;height:14px;border-radius:2px;background:{{ tierGrad }};\"><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#c8cedb;\">里程碑 // MILESTONE<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ milestones }}\" as=\"m\" hint-placeholder-count=\"1\">\n        <div sc-camel-on-click=\"{{ m.onEdit }}\" title=\"点击编辑此里程碑\" style=\"cursor:pointer;border:1px solid transparent;border-radius:11px;background:linear-gradient(180deg,{{ rowTop }} 0%,{{ rowBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.18),rgba(255,255,255,0.04) 45%,rgba(255,255,255,0.02)) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);padding:12px;display:flex;flex-direction:column;gap:8px;\" style-hover=\"box-shadow:inset 0 1px 0 rgba(255,255,255,0.06),0 0 0 1px {{ accent }},0 10px 26px rgba(0,0,0,0.5);\">\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <div style=\"flex:1;font-size:15px;font-weight:700;letter-spacing:0.2px;color:#eef1f7;\">{{ m.name }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8b93a4;\">{{ m.cur }}/{{ m.target }}<\u002Fdiv>\n            <sc-if value=\"{{ m.hasDeadline }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ m.deadlineColor }};\">⏳ {{ m.deadlineLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:{{ accent }};\">达成 {{ m.bonusStr }} EXP<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ m.onDel }}\" style=\"cursor:pointer;color:#3d4353;font-size:15px;\" style-hover=\"color:#f87171;\">×<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:6px;border-radius:99px;background:#1e222b;overflow:hidden;\">\n            <div style=\"height:100%;width:{{ m.barW }};background:{{ accent }};border-radius:99px;transition:width 0.3s;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;\">\n            <sc-if value=\"{{ m.pending }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ m.onUndo }}\" title=\"点一下可撤销(几秒后自动确认)\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#14151c;background:{{ btnGrad }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(0,0,0,0.35),0 4px 14px rgba(0,0,0,0.4);text-shadow:0 1px 0 rgba(255,255,255,0.25);border-radius:8px;padding:5px 14px;\" style-hover=\"filter:brightness(1.15);\">{{ m.pendingLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ m.showProgress }}\" hint-placeholder-val=\"{{ true }}\">\n              <div sc-camel-on-click=\"{{ m.onPlus }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#e6e9f0;border:1px solid #2f3542;background:#161a22;border-radius:8px;padding:5px 12px;\" style-hover=\"border-color:#4ade80;\">推进 {{ m.stepStr }}<\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#697084;\">还差 {{ m.remain }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ m.showReady }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ m.onClaim }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#14151c;background:{{ btnGrad }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(0,0,0,0.35),0 4px 14px rgba(0,0,0,0.4);text-shadow:0 1px 0 rgba(255,255,255,0.25);border-radius:8px;padding:5px 14px;\">✦ 领取 {{ m.bonusStr }} EXP<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ m.showClaimed }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4ade80;\">✓ 已达成并入账<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:8px;align-items:center;\">\n        <input id=\"nm-name\" placeholder=\"大目标名\" style=\"flex:1;min-width:0;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px 10px;color:#e6e9f0;font-size:13px;font-family:inherit;\">\n        <input id=\"nm-target\" placeholder=\"总量\" type=\"number\" style=\"width:56px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n        <input id=\"nm-step\" placeholder=\"步长\" type=\"number\" style=\"width:52px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n        <input id=\"nm-bonus\" placeholder=\"奖励EXP\" type=\"number\" style=\"width:72px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n        <input id=\"nm-deadline\" type=\"date\" title=\"截止日期(可选)\" style=\"width:120px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:7px 8px;color:#aeb6c6;font-size:12px;font-family:'JetBrains Mono',monospace;\">\n        <div sc-camel-on-click=\"{{ addMilestone }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:{{ accent }};border:1px solid #2a2f3a;border-radius:8px;padding:7px 12px;\" style-hover=\"border-color:#4ade80;\">+ 添加<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- LEDGER -->\n    <sc-if value=\"{{ showLedger }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:linear-gradient(180deg,{{ cardTop }} 0%,{{ cardBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.24),rgba(255,255,255,0.06) 38%,rgba(255,255,255,0.02) 72%,rgba(255,255,255,0.07)) border-box;border:1.5px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 18px 46px rgba(0,0,0,0.42);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:2px;\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;\">\n          <div style=\"width:3px;height:14px;border-radius:2px;background:{{ tierGrad }};\"><\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#c8cedb;\">时间轴 // TIMELINE<\u002Fdiv>\n          <div style=\"flex:1;\"><\u002Fdiv>\n          <input type=\"date\" value=\"{{ selDateISO }}\" max=\"{{ todayISO }}\" sc-camel-on-change=\"{{ onPickDate }}\" title=\"跳转到某一天\" style=\"background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:5px 8px;color:#aeb6c6;font-size:11.5px;font-family:'JetBrains Mono',monospace;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;\">\n          <div sc-camel-on-click=\"{{ onPrevDay }}\" title=\"前一天\" style=\"cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid #262b36;background:#0d0f14;color:#c3c9d6;font-size:15px;\" style-hover=\"border-color:{{ accent }};\">‹<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;justify-content:center;gap:8px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#eef1f7;letter-spacing:0.5px;\">{{ selDateLabel }}<\u002Fdiv>\n            <sc-if value=\"{{ selDateRelShow }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;color:#14151c;background:{{ btnGrad }};border-radius:99px;padding:2px 9px;\">{{ selDateRel }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onNextDay }}\" title=\"后一天\" style=\"cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid #262b36;background:#0d0f14;color:{{ nextColor }};font-size:15px;\" style-hover=\"border-color:{{ nextHover }};\">›<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ onToday }}\" title=\"回到今天\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#aeb6c6;border:1px solid #262b36;background:#0d0f14;border-radius:8px;padding:0 12px;height:30px;display:grid;place-items:center;\" style-hover=\"border-color:{{ accent }};color:#eef1f7;\">今天<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;\">\n          <div style=\"border:1px solid #1a1e27;border-radius:9px;background:#0d0f14;padding:8px 10px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#8b93a4;\">当日挣分<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#4ade80;\">{{ dayEarnedStr }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #1a1e27;border-radius:9px;background:#0d0f14;padding:8px 10px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#8b93a4;\">当日兑换<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#f87171;\">{{ daySpentStr }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #1a1e27;border-radius:9px;background:#0d0f14;padding:8px 10px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1px;color:#8b93a4;\">当日净变化<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:{{ dayNetColor }};\">{{ dayNetStr }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ dayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:22px 0;color:#535a6a;font-size:12.5px;font-family:'JetBrains Mono',monospace;letter-spacing:1px;\">· 这一天还没有记录 ·<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ dayLedger }}\" as=\"e\" hint-placeholder-count=\"0\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #14171e;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#535a6a;white-space:nowrap;\">{{ e.time }}<\u002Fdiv>\n            <div style=\"flex:1;font-size:13px;color:#c3c9d6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ e.name }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:{{ e.deltaColor }};\">{{ e.deltaStr }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- POMODORO TAB -->\n  <sc-if value=\"{{ isPomo }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:18px 24px 0;display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start;\">\n    <div style=\"background:linear-gradient(180deg,{{ cardTop }} 0%,{{ cardBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.24),rgba(255,255,255,0.06) 38%,rgba(255,255,255,0.02) 72%,rgba(255,255,255,0.07)) border-box;border:1.5px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 18px 46px rgba(0,0,0,0.42);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:3px;height:14px;border-radius:2px;background:{{ tierGrad }};\"><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#c8cedb;\">番茄专注 // FOCUS<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;gap:8px;\">\n        <div sc-camel-on-click=\"{{ setP25 }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ p25.color }};background:{{ p25.bg }};border:1px solid {{ p25.border }};border-radius:8px;padding:7px 16px;\">25 min<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ setP45 }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ p45.color }};background:{{ p45.bg }};border:1px solid {{ p45.border }};border-radius:8px;padding:7px 16px;\">45 min<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ setPCustom }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ pcustom.color }};background:{{ pcustom.bg }};border:1px solid {{ pcustom.border }};border-radius:8px;padding:7px 16px;\">自定义<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isPCustom }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;\">\n          <input type=\"number\" value=\"{{ pomoCustomMin }}\" sc-camel-on-input=\"{{ onCustomMin }}\" min=\"1\" style=\"width:78px;text-align:center;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:14px;font-family:'JetBrains Mono',monospace;\">\n          <span style=\"font-size:12.5px;color:#8b93a4;\">分钟<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;justify-content:center;padding:6px 0;\">\n        <div style=\"width:236px;height:236px;border-radius:50%;background:{{ pomoRingBg }};display:grid;place-items:center;box-shadow:0 12px 40px rgba(0,0,0,0.4);\">\n          <div style=\"width:204px;height:204px;border-radius:50%;background:radial-gradient(circle at 50% 34%,#191c25,#0e1016);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:52px;line-height:1;background-image:{{ tierGrad }};-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6));\">{{ pomoTime }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#8b93a4;\">{{ pomoStateLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;gap:10px;\">\n        <sc-if value=\"{{ pomoRunning }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ pomoPause }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#14151c;background:{{ btnGrad }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(0,0,0,0.35),0 4px 14px rgba(0,0,0,0.4);text-shadow:0 1px 0 rgba(255,255,255,0.25);border-radius:9px;padding:9px 26px;\" style-hover=\"filter:brightness(1.12);\">暂停<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ pomoIdle }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ pomoStart }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#14151c;background:{{ btnGrad }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(0,0,0,0.35),0 4px 14px rgba(0,0,0,0.4);text-shadow:0 1px 0 rgba(255,255,255,0.25);border-radius:9px;padding:9px 26px;\" style-hover=\"filter:brightness(1.12);\">{{ pomoStartLabel }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div sc-camel-on-click=\"{{ pomoReset }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#aeb6c6;border:1px solid #2a2f3a;border-radius:9px;padding:9px 22px;\" style-hover=\"border-color:{{ accent }};color:#eef1f7;\">重置<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:linear-gradient(180deg,{{ cardTop }} 0%,{{ cardBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.24),rgba(255,255,255,0.06) 38%,rgba(255,255,255,0.02) 72%,rgba(255,255,255,0.07)) border-box;border:1.5px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 18px 46px rgba(0,0,0,0.42);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"width:3px;height:14px;border-radius:2px;background:{{ tierGrad }};\"><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#c8cedb;\">白噪音 // AMBIENCE<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n        <div sc-camel-on-click=\"{{ setCafe }}\" style=\"cursor:pointer;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ nCafe.color }};background:{{ nCafe.bg }};border:1px solid {{ nCafe.border }};border-radius:9px;padding:11px 0;\">☕ 咖啡馆<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ setRain }}\" style=\"cursor:pointer;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ nRain.color }};background:{{ nRain.bg }};border:1px solid {{ nRain.border }};border-radius:9px;padding:11px 0;\">☂ 雨天<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ setSnow }}\" style=\"cursor:pointer;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ nSnow.color }};background:{{ nSnow.bg }};border:1px solid {{ nSnow.border }};border-radius:9px;padding:11px 0;\">❄ 雪天<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ setCustomNoise }}\" style=\"cursor:pointer;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:{{ nCustom.color }};background:{{ nCustom.bg }};border:1px solid {{ nCustom.border }};border-radius:9px;padding:11px 0;\">♫ 自定义<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ noiseHasFile }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b93a4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">本地音乐:{{ noiseFileName }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div sc-camel-on-click=\"{{ toggleNoise }}\" style=\"cursor:pointer;text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#14151c;background:{{ btnGrad }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(0,0,0,0.35),0 4px 14px rgba(0,0,0,0.4);text-shadow:0 1px 0 rgba(255,255,255,0.25);border-radius:9px;padding:10px 0;\" style-hover=\"filter:brightness(1.12);\">{{ noiseBtnLabel }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;color:#8b93a4;white-space:nowrap;\">音量<\u002Fspan>\n        <input type=\"range\" min=\"0\" max=\"1\" step=\"0.05\" value=\"{{ noiseVol }}\" sc-camel-on-input=\"{{ onVol }}\" style=\"flex:1;accent-color:{{ accent }};\">\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;color:#535a6a;\">环境音为本机实时合成,无需联网;「自定义」可选本地音乐循环播放。<\u002Fdiv>\n      <input id=\"noise-file\" type=\"file\" accept=\"audio/*\" sc-camel-on-change=\"{{ onNoiseFile }}\" style=\"display:none;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- COUNTDOWN TAB -->\n  <sc-if value=\"{{ isCountdown }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 24px 0;\">\n    <div style=\"background:linear-gradient(180deg,{{ cardTop }} 0%,{{ cardBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.24),rgba(255,255,255,0.06) 38%,rgba(255,255,255,0.02) 72%,rgba(255,255,255,0.07)) border-box;border:1.5px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,0.07),0 18px 46px rgba(0,0,0,0.42);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:2px;\"><div style=\"width:3px;height:14px;border-radius:2px;background:{{ tierGrad }};\"><\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#c8cedb;\">未来倒计时 // COUNTDOWN<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ countdowns }}\" as=\"cd\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid transparent;border-radius:12px;background:linear-gradient(180deg,{{ rowTop }} 0%,{{ rowBot }} 100%) padding-box,linear-gradient(200deg,rgba(255,255,255,0.18),rgba(255,255,255,0.04) 45%,rgba(255,255,255,0.02)) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);\">\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-size:16px;font-weight:700;letter-spacing:0.2px;color:#eef1f7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ cd.name }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b93a4;margin-top:3px;\">截止 {{ cd.dueStr }} · 以午夜 00:00 为界<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ cd.isToday }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:#fbbf24;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5));\">就在今天<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ cd.showNum }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:baseline;gap:5px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b93a4;\">{{ cd.prefix }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;line-height:1;color:{{ cd.numColor }};filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5));\">{{ cd.numText }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#c3c9d6;\">天<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div sc-camel-on-click=\"{{ cd.onDel }}\" style=\"cursor:pointer;color:#3d4353;font-size:16px;padding-left:4px;\" style-hover=\"color:#f87171;\">×<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:8px;align-items:center;margin-top:4px;\">\n        <input id=\"nc-name\" placeholder=\"事件名(如:六级考试)\" style=\"flex:1;min-width:0;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:9px 10px;color:#e6e9f0;font-size:13px;font-family:inherit;\">\n        <input id=\"nc-date\" type=\"date\" title=\"目标日期\" style=\"width:150px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#aeb6c6;font-size:12.5px;font-family:'JetBrains Mono',monospace;\">\n        <div sc-camel-on-click=\"{{ addCountdown }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:{{ accent }};border:1px solid #2a2f3a;border-radius:8px;padding:8px 14px;\" style-hover=\"border-color:{{ accent }};\">+ 添加<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- BOTTOM NAV -->\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,rgba(14,16,22,0.80),rgba(9,10,14,0.94));backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,0.08);box-shadow:0 -8px 30px rgba(0,0,0,0.4);\">\n    <div style=\"max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;\">\n      <div sc-camel-on-click=\"{{ goLists }}\" style=\"cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 13px;color:{{ navListsColor }};\">\n        <sc-if value=\"{{ navListsActive }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:3px;border-radius:0 0 3px 3px;background:{{ tierGrad }};\"><\u002Fdiv><\u002Fsc-if>\n        <div style=\"font-size:18px;line-height:1;\">▤<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;\">Lists<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goPomo }}\" style=\"cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 13px;color:{{ navPomoColor }};\">\n        <sc-if value=\"{{ navPomoActive }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:3px;border-radius:0 0 3px 3px;background:{{ tierGrad }};\"><\u002Fdiv><\u002Fsc-if>\n        <div style=\"font-size:18px;line-height:1;\">◷<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;\">番茄专注<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goCountdown }}\" style=\"cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 13px;color:{{ navCountdownColor }};\">\n        <sc-if value=\"{{ navCountdownActive }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:3px;border-radius:0 0 3px 3px;background:{{ tierGrad }};\"><\u002Fdiv><\u002Fsc-if>\n        <div style=\"font-size:18px;line-height:1;\">⧗<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;\">未来倒计时<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- EDIT MODAL -->\n  <sc-if value=\"{{ editOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeEdit }}\" style=\"position:fixed;inset:0;background:rgba(6,7,10,0.66);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width:340px;background:#101218;border:1px solid #2a2f3a;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 64px rgba(0,0,0,0.65);\">\n        <sc-if value=\"{{ editAsk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:15px;font-weight:700;\">要编辑「{{ editItemName }}」吗?<\u002Fdiv>\n          <div style=\"font-size:12px;color:#8b93a4;line-height:1.6;\">可修改名称、分值、循环/截止日期等信息。照片不用进编辑:直接把新图片拖到卡片的图上即可更换。<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;justify-content:flex-end;\">\n            <div sc-camel-on-click=\"{{ closeEdit }}\" style=\"cursor:pointer;font-size:12.5px;color:#8b93a4;border:1px solid #262b36;border-radius:8px;padding:7px 14px;\" style-hover=\"color:#e6e9f0;\">取消<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ confirmEdit }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:#14151c;background:{{ btnGrad }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(0,0,0,0.35),0 4px 14px rgba(0,0,0,0.4);text-shadow:0 1px 0 rgba(255,255,255,0.25);border-radius:8px;padding:7px 16px;\" style-hover=\"filter:brightness(1.12);\">编辑<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ editFormOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:#aeb6c6;\">编辑{{ editTypeName }} // EDIT<\u002Fdiv>\n          <label style=\"display:block;font-size:11px;color:#697084;\">名称\n            <input id=\"ed-name\" sc-camel-default-value=\"{{ editName }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px 10px;color:#e6e9f0;font-size:13px;font-family:inherit;\">\n          <\u002Flabel>\n          <sc-if value=\"{{ editIsTask }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:8px;\">\n              <label style=\"flex:1;font-size:11px;color:#697084;\">EXP 分值\n                <input id=\"ed-exp\" type=\"number\" sc-camel-default-value=\"{{ editExp }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n              <\u002Flabel>\n              <label style=\"flex:1;font-size:11px;color:#697084;\">每周期次数\n                <input id=\"ed-times\" type=\"number\" sc-camel-default-value=\"{{ editTimes }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n              <\u002Flabel>\n              <label style=\"flex:1;font-size:11px;color:#697084;\">循环\n                <sc-raw-select id=\"ed-cycle\" sc-camel-default-value=\"{{ editCycle }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px 6px;color:#aeb6c6;font-size:12px;\">\n                  <option value=\"daily\">每日<\u002Foption><option value=\"weekly\">每周<\u002Foption><option value=\"monthly\">每月<\u002Foption><option value=\"once\">单次<\u002Foption><option value=\"free\">不限次<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ editIsReward }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:block;font-size:11px;color:#697084;\">价格(EXP)\n              <input id=\"ed-cost\" type=\"number\" sc-camel-default-value=\"{{ editCost }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ editIsMilestone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:8px;\">\n              <label style=\"flex:1;font-size:11px;color:#697084;\">总量\n                <input id=\"ed-target\" type=\"number\" sc-camel-default-value=\"{{ editTarget }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n              <\u002Flabel>\n              <label style=\"flex:1;font-size:11px;color:#697084;\">步长\n                <input id=\"ed-step\" type=\"number\" sc-camel-default-value=\"{{ editStep }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n              <\u002Flabel>\n              <label style=\"flex:1;font-size:11px;color:#697084;\">奖励 EXP\n                <input id=\"ed-bonus\" type=\"number\" sc-camel-default-value=\"{{ editBonus }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:8px;color:#e6e9f0;font-size:13px;font-family:'JetBrains Mono',monospace;\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display:block;font-size:11px;color:#697084;\">截止日期(可留空)\n              <input id=\"ed-deadline\" type=\"date\" sc-camel-default-value=\"{{ editDeadline }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;background:#0d0f14;border:1px solid #262b36;border-radius:8px;padding:7px 8px;color:#aeb6c6;font-size:12px;font-family:'JetBrains Mono',monospace;\">\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:2px;\">\n            <div sc-camel-on-click=\"{{ closeEdit }}\" style=\"cursor:pointer;font-size:12.5px;color:#8b93a4;border:1px solid #262b36;border-radius:8px;padding:7px 14px;\" style-hover=\"color:#e6e9f0;\">取消<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ saveEdit }}\" style=\"cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:#14151c;background:{{ btnGrad }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),inset 0 -1px 0 rgba(0,0,0,0.35),0 4px 14px rgba(0,0,0,0.4);text-shadow:0 1px 0 rgba(255,255,255,0.25);border-radius:8px;padding:7px 16px;\" style-hover=\"filter:brightness(1.12);\">保存<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;goldAt&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;min&quot;:100,&quot;max&quot;:10000,&quot;step&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;等级门槛&quot;},&quot;diamondAt&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:400,&quot;min&quot;:200,&quot;max&quot;:50000,&quot;step&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;等级门槛&quot;},&quot;interestRate&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;%/日&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;利息&quot;},&quot;coreQuota&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;战时模式&quot;},&quot;showLedger&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;模块&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let s = null;\n    try { s = JSON.parse(localStorage.getItem('exp-bank-v1')); } catch (e) {}\n    if (s && s.tasks) {\n      s.tasks = s.tasks.map(t => ({ ...t, times: t.times || 1, streak: t.streak || 0, lastDone: t.lastDone || '',\n        done: Object.fromEntries(Object.entries(t.done || {}).map(([k, v]) => [k, v === true ? 1 : v])) }));\n      if (!s.countdowns) s.countdowns = this.defaultCountdowns();\n      if (!s.tab) s.tab = 'lists';\n      if (!s.pomoPreset) s.pomoPreset = '25';\n      if (s.pomoCustomMin == null) s.pomoCustomMin = 30;\n      if (!s.noisePreset) s.noisePreset = '咖啡馆';\n      if (s.noiseVol == null) s.noiseVol = 0.5;\n
